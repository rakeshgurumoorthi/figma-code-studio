<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${componentName} + ' preview'">Preview</title>
    <style>
        html, body { margin: 0; min-height: 100%; }
        #preview-error {
            display: none; position: fixed; inset: 0; z-index: 2147483647; overflow: auto;
            background: rgba(15, 17, 23, 0.94); color: #fecaca; padding: 24px;
            font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap;
        }
        #preview-error strong { color: #fff; font-size: 14px; display: block; margin-bottom: 8px; }
    </style>
    <script src="/webjars/tailwindcss__browser/dist/index.global.js"></script>
    <script src="/webjars/react/umd/react.production.min.js"></script>
    <script src="/webjars/react-dom/umd/react-dom.production.min.js"></script>
    <script src="/webjars/babel__standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<div id="preview-error"></div>
<script th:inline="javascript">
    window.__PREVIEW__ = {
        code: /*[[${code}]]*/ "",
        assets: /*[[${assets}]]*/ {}
    };
</script>
<script src="/js/preview-runtime.js"></script>
</body>
</html>
